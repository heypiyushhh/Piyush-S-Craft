name: Production CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # =========================================================================
  # 1. Backend Validation (.NET Solution)
  # =========================================================================
  backend-validation:
    name: Backend Build & Test (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK (8.0.x LTS)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore DevWithPiyush/DevWithPiyush.slnx

      - name: Verify Code Formatting
        run: dotnet format DevWithPiyush/DevWithPiyush.slnx --verify-no-changes --verbosity diagnostic

      - name: Build Solution (Release Mode)
        run: dotnet build DevWithPiyush/DevWithPiyush.slnx -c Release --no-restore /p:TreatWarningsAsErrors=true

      - name: Execute Unit Tests
        run: dotnet test DevWithPiyush/DevWithPiyush.slnx -c Release --no-build --verbosity normal

  # =========================================================================
  # 2. Frontend Validation (React + Vite + TypeScript)
  # =========================================================================
  frontend-validation:
    name: Frontend Quality & Build (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intro-app

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: intro-app/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint / Oxlint Check
        run: npm run lint

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Build Production Assets
        run: npm run build

  # =========================================================================
  # 3. Docker Container Validation
  # =========================================================================
  docker-validation:
    name: Docker Image Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: devwithpiyush:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 4. Security & Vulnerability Scan
  # =========================================================================
  security-scan:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
